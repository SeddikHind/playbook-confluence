<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playbook Confluence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Confluence-like shell. Top bar, page tree on the left, a 760px reading column on the right. */
:root{
  --bg:#ffffff; --fg:#172b4d; --muted:#505f79; --faint:#6b778c;
  --line:#dfe1e6; --side:#f7f8f9; --hover:#ebecf0; --accent:#0c66e4; --accent-fg:#ffffff;
  --info-bg:#e9f2ff; --info-line:#cce0ff;
  --note-bg:#fff7d6; --note-line:#f8e6a0;
  --miro-bg:#fff9e0; --miro-line:#f5cd47;
  --lz-grey:#dfe1e6; --lz-grey-fg:#44546f; --lz-blue:#cce0ff; --lz-blue-fg:#0055cc;
  --lz-yellow:#f8e6a0; --lz-yellow-fg:#7f5f01; --lz-green:#baf3db; --lz-green-fg:#216e4e;
  --lz-red:#ffd5d2; --lz-red-fg:#ae2e24; --lz-purple:#dfd8fd; --lz-purple-fg:#5e4db2;
  --done:#6b778c; --check:#0c66e4;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Ubuntu,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d2125; --fg:#dee4ea; --muted:#9fadbc; --faint:#8c9bab;
  --line:#2c333a; --side:#161a1d; --hover:#282e33; --accent:#579dff; --accent-fg:#1d2125;
  --info-bg:#092957; --info-line:#0c3a7a; --note-bg:#3a2c00; --note-line:#533f04;
  --miro-bg:#332a05; --miro-line:#7f5f01;
  --lz-grey:#2c333a; --lz-grey-fg:#b6c2cf; --lz-blue:#09326c; --lz-blue-fg:#85b8ff;
  --lz-yellow:#533f04; --lz-yellow-fg:#f8e6a0; --lz-green:#164b35; --lz-green-fg:#7ee2b8;
  --lz-red:#5d1f1a; --lz-red-fg:#fd9891; --lz-purple:#352c63; --lz-purple-fg:#b8acf6;
  --done:#8c9bab; --check:#579dff; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1d2125; --fg:#dee4ea; --muted:#9fadbc; --faint:#8c9bab;
  --line:#2c333a; --side:#161a1d; --hover:#282e33; --accent:#579dff; --accent-fg:#1d2125;
  --info-bg:#092957; --info-line:#0c3a7a; --note-bg:#3a2c00; --note-line:#533f04;
  --miro-bg:#332a05; --miro-line:#7f5f01;
  --lz-grey:#2c333a; --lz-grey-fg:#b6c2cf; --lz-blue:#09326c; --lz-blue-fg:#85b8ff;
  --lz-yellow:#533f04; --lz-yellow-fg:#f8e6a0; --lz-green:#164b35; --lz-green-fg:#7ee2b8;
  --lz-red:#5d1f1a; --lz-red-fg:#fd9891; --lz-purple:#352c63; --lz-purple-fg:#b8acf6;
  --done:#8c9bab; --check:#579dff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;height:52px;
  border-bottom:1px solid var(--line);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.space-icon{width:28px;height:28px;border-radius:4px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.space-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.space-name small{display:block;font-weight:400;color:var(--faint);font-size:12px;line-height:1.2}
.top .grow{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:6px 10px;font:inherit;cursor:pointer}
.sim-tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:2px 6px;white-space:nowrap}

.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100% - 52px)}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 8px 32px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.side h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:8px 12px 8px;font-weight:600}
.tree{list-style:none;margin:0;padding:0}
.tree a{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:4px;color:var(--fg);font-size:14px;line-height:1.35}
.tree a:hover{background:var(--hover);text-decoration:none}
.tree a[aria-current="page"]{background:var(--lz-blue);color:var(--lz-blue-fg);font-weight:600}
.tree .child a{padding-left:30px}
.tree .bullet{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.tree .lane{width:10px;height:10px;border-radius:2px;flex:none}
.tree .count{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:780px;margin:0 auto}
.crumbs{font-size:13px;color:var(--faint);margin-bottom:12px}
.crumbs a{color:var(--faint)}
h1.title{font-size:28px;line-height:1.25;font-weight:600;margin:0 0 8px;text-wrap:balance;letter-spacing:-.01em}
.byline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;color:var(--faint);font-size:13px;margin-bottom:20px}
.progress{display:flex;align-items:center;gap:8px}
.bar{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lz-green-fg);width:0}
.tools{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:var(--hover)}

.content h2{font-size:20px;font-weight:600;margin:32px 0 8px;line-height:1.3;text-wrap:balance}
.content h3{font-size:16px;font-weight:600;margin:20px 0 6px}
.content p{margin:6px 0 10px;max-width:68ch}
.content ul.list{margin:6px 0 12px;padding-left:22px}
.content ul.list li{margin:3px 0}

.panel{border:1px solid var(--info-line);background:var(--info-bg);border-radius:4px;padding:12px 16px;margin:12px 0 16px}
.panel.note{background:var(--note-bg);border-color:var(--note-line)}
.panel p{margin:4px 0}
.panel-title{font-weight:600;margin-bottom:4px}

.miro{border:1px solid var(--miro-line);background:var(--miro-bg);border-radius:4px;padding:12px 16px;margin:0 0 20px}
.miro-head{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.miro-dot{width:18px;height:18px;border-radius:4px;background:#ffd02f;color:#050038;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.miro-links{display:flex;flex-wrap:wrap;gap:6px}
.miro-links a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:3px 9px;font-size:13px;color:var(--fg)}
.miro-links a:hover{border-color:var(--accent);text-decoration:none}
.miro-links a::after{content:"↗";color:var(--faint);font-size:11px}
.phase-link{font-size:13px;margin:-2px 0 8px;display:inline-flex;gap:6px;align-items:center}

.tasks{list-style:none;margin:4px 0 12px;padding:0}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:4px 6px;border-radius:4px}
.tasks li:hover{background:var(--hover)}
.tasks input{appearance:none;width:16px;height:16px;margin:3px 0 0;border:2px solid var(--faint);border-radius:3px;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--bg)}
.tasks input:checked{background:var(--check);border-color:var(--check)}
.tasks input:checked::after{content:"";width:4px;height:8px;border:solid var(--accent-fg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tasks label{cursor:pointer;min-width:0}
.tasks input:checked + label .txt{text-decoration:line-through;color:var(--done)}
.meta{color:var(--faint);font-size:12.5px;white-space:nowrap}
.tchip{display:inline-block;font-family:var(--mono);font-size:11.5px;border:1px solid var(--miro-line);background:var(--miro-bg);color:var(--fg);border-radius:3px;padding:0 5px;margin-left:4px;vertical-align:1px}
.tchip:hover{text-decoration:none;border-color:var(--accent)}

.lz{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:3px;padding:1px 5px;white-space:nowrap;line-height:1.5}
.lz.grey{background:var(--lz-grey);color:var(--lz-grey-fg)} .lz.blue{background:var(--lz-blue);color:var(--lz-blue-fg)}
.lz.yellow{background:var(--lz-yellow);color:var(--lz-yellow-fg)} .lz.green{background:var(--lz-green);color:var(--lz-green-fg)}
.lz.red{background:var(--lz-red);color:var(--lz-red-fg)} .lz.purple{background:var(--lz-purple);color:var(--lz-purple-fg)}

.fields{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:8px 0 16px}
.fields div{padding:8px 12px;border-bottom:1px solid var(--line)}
.fields div:nth-last-child(-n+2){border-bottom:0}
.fields .k{background:var(--side);font-weight:600}
.ph{color:var(--faint)}

.tbl-wrap{overflow-x:auto;margin:8px 0 16px;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--side);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.c{text-align:center}
select.st{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);padding:2px 4px}

.lane-a{background:#8f7fee}.lane-b{background:#fe9f4d}.lane-c{background:#659df2}.lane-d{background:#2dc75c}.lane-g{background:#ffdc4a}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none;border-right:0;border-bottom:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .side.open{display:block}
  .menu-btn{display:inline-block}
  .sim-tag{display:none}
  .fields{grid-template-columns:1fr}
  .fields .k{border-bottom:0;padding-bottom:2px}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="top">
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">Pages</button>
  <div class="space-icon">DT</div>
  <div class="space-name">Digital Transformation Playbook<small>Espace · [Nom du projet]</small></div>
  <div class="grow"></div>

</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Arborescence des pages">
    <h2>Pages</h2>
    <ul class="tree" id="tree"></ul>
  </nav>
  <main>
    <article class="page" id="page"></article>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>

const PR = "[Responsable] · [Date]";

/* ---------- Streams : sous-blocs de la démarche client (1-0 à 5-3) rangés par stream ---------- */
const STREAMS = {
 "stream-a": {lane:"a", name:"A · Product et Business",
  role:"Objectifs business, stratégie produit, alignement des parties prenantes, exigences métier, proposition de valeur, priorisation, roadmap produit, métriques de succès.",

    syn:["Vision cible transmise à l'Architecture pour le GAP IT (2-2, stream C)","Business goals traduits en KPIs de valeur et d'adoption avec le stream D"]},

  +table(["Activité ou livrable",...RACI_COLS,"Facilitator"],RACI.map((r,i)=>[esc(r[0]),...r.slice(1).map(raciLz),`<span class="lz purple">F</span> ${esc(FACILITATORS[i])}`]),true)

  +`<h2>Rituels de gouvernance</h2>`+tasks("gouvernance","rit",["Comité projet toutes les [Fréquence] · sponsor, Product Owner, leads des 4 streams","Revue du registre des risques à chaque comité","Mise à jour du Tableau de bord avant chaque comité","Revue pré-gate 2 jours avant chaque gate"],false);

 miro(){

 "roles-atelier"(){
  const lz=(k)=>{const r=ROLES.find(x=>x[0]===k);return `<span class="lz ${r[3]}">${k}</span> <strong>${r[1]}</strong>`;};
  const STEPS=[
   {t:"Étape 1 · Préparer", w:"5 à 2 jours avant l'atelier", items:{
     F:["Définir l'objectif de l'atelier et le résultat attendu","Choisir le template Miro (T01 à T19) et le dupliquer","Attribuer un rôle à chaque invité et l'indiquer dans l'invitation","Envoyer l'invitation avec l'agenda et les inputs à lire"],
     V:["Valider l'objectif, le résultat attendu et la liste des invités"],
     D:["Préparer les inputs : données, existant, maquettes, analyses","Pré-remplir les zones du template quand c'est utile"],
     P:["Lire les inputs avant l'atelier"],
     I:["Recevoir l'agenda pour information (pas d'invitation à l'atelier)"]}},
   {t:"Étape 2 · Animer", w:"Pendant l'atelier", items:{
     F:["Ouvrir en rappelant l'objectif, les rôles et les règles","Tenir le temps avec le minuteur du template","Faire contribuer tout le monde, puis faire converger","Rester neutre : le Facilitator ne tranche pas"],
     D:["Présenter les inputs","Capturer et structurer les contributions dans Miro"],
     P:["Contribuer : post-it, idées, expertise, votes"],
     V:["Écouter et poser les questions qui aideront à décider"]}},
   {t:"Étape 3 · Décider", w:"Les 10 dernières minutes", items:{
     F:["Relire à voix haute les décisions et les actions"],
     V:["Valider, demander des ajustements ou refuser chaque décision"],
     D:["Prendre les actions avec une date d'échéance"],
     P:["Signaler un désaccord ou un risque avant la clôture"]}},
   {t:"Étape 4 · Restituer", w:"Dans les 24 heures", items:{
     F:["Rédiger le compte-rendu à partir du modèle et le publier sous « Comptes-rendus d'ateliers »","Reporter les décisions dans le Decision Log"],
     D:["Mettre à jour le statut des livrables dans le Tableau de bord"],
     V:["Relire le compte-rendu et confirmer les décisions"],
     I:["Recevoir le compte-rendu"]}},
   {t:"Étape 5 · Suivre", w:"Jusqu'à l'atelier suivant ou au jalon", items:{
     D:["Réaliser les actions et produire les livrables"],
     V:["Valider les livrables quand ils sont prêts"],
     F:["Vérifier l'avancement des actions","Déclencher les points de synchronisation avec les autres streams","Préparer l'atelier suivant ou le jalon ou la revue"],
     I:["Suivre l'avancement dans le Tableau de bord"]}}
  ];
  let h=panel("En une phrase","<p>Le Facilitator fait avancer le groupe, les Doers produisent, les Participants enrichissent, le Validator tranche, les Informed sont tenus au courant.</p>");
  const roleLz=v=>{ if(v==="-") return '<span class="ph">–</span>'; const c={"F":"purple","F/D":"purple","V":"green","D":"blue","P":"yellow","I":"grey"}[v]; return `<span class="lz ${c}">${v}</span>`; };
  h+=`<h2>Parties prenantes de la Digital Factory</h2>`
   +table(["Partie prenante","Rôle dans le projet"],STAKE.map(s=>[`<strong>${esc(s[1])}</strong>`,esc(s[2])]));
  h+=`<h2>Rôle de chaque partie prenante, atelier par atelier</h2>`
   +`<p>Proposition par défaut, à ajuster au projet. F = Facilitator · V = Validator · D = Doer · P = Participant · I = Informed · F/D = anime et produit · – = non concerné. Cliquez sur un code d'atelier pour ouvrir son template dans Miro.</p>`
   +table(["Atelier",...STAKE.map(s=>s[1].replace(" · Hicham",""))],ATELIER_ROLES.map(r=>{
      const k=r[0]; const name=k==="Gates"?"Jalons client et revues internes":T_NAMES[k];
      const head=k==="Gates"?`<a href="#gates"><strong>${esc(name)}</strong></a>`:`<a class="tchip" style="margin:0 6px 0 0" href="${url(k)}" target="_blank" rel="noopener">${k}</a>${esc(name)}`;
      return [head,...r.slice(1).map(roleLz)];
    }),true);
  h+=`<h2>Ce que fait chaque rôle à chaque étape</h2>`+table(["Rôle","Préparer","Animer","Décider","Restituer","Suivre"],
    ["F","V","D","P","I"].map(k=>[lz(k),...STEPS.map(s=>s.items[k]?esc(s.items[k][0]):'<span class="ph">·</span>')]));
  STEPS.forEach((s,i)=>{
    h+=`<h2>${esc(s.t)}</h2><p><strong>Quand :</strong> ${esc(s.w)}</p>`;
    ["F","V","D","P","I"].forEach(k=>{ if(s.items[k]){ h+=`<h3>${lz(k)}</h3>`+tasks("roles-atelier",`s${i}${k}`,s.items[k],false); }});
  });
  return h+`<h2>Règles d'or</h2>`+list(["Une seule personne Validator par décision.","Le Facilitator ne tranche pas : il garantit la méthode, pas le contenu.","Au-delà de 8 Participants actifs, faire des sous-groupes.","Les Informed ne sont pas invités à l'atelier : ils reçoivent le compte-rendu.","Chaque action sort de l'atelier avec un Doer et une date."]);
 },

  +`<h2>Informations</h2>`+fields([["Atelier","[T01 à T19 · Nom de l'atelier]"],["Frame Miro","[Lien]"],["Étape","[00 à 05]"],["Stream porteur","[A, B, C ou D]"],["Date et durée","[Date] · [Durée]"]])

function streamBody(id){
  const s=STREAMS[id];
  let h=fields([["Responsable","[Responsable]"],["Contributeurs","[Noms]"],["Rôle du stream",s.role]])
   +panel("Comment utiliser cette page","<p>Cochez les activités au fil de l'eau, avec un responsable (@) et une date sur chaque ligne. Le statut des livrables se met à jour dans le <a href=\"#tableau\">Tableau de bord</a>. Les codes T01 à T19 ouvrent le template d'atelier dans Miro.</p>");
  s.phases.forEach((p,i)=>{
   h+=`<h2>${phaseHead(i)}</h2>${phaseLink(i)}<p><strong>Objectif de l'étape :</strong> ${esc(PH[i].obj)}</p>`
    +`<h3>Activités</h3>`+tasks(id,"p"+i+"a",p.act)
    +`<h3>Contributions aux livrables communs</h3>`+tasks(id,"p"+i+"c",p.con,false)
    +`<h3>Synchronisation</h3>`+tasks(id,"p"+i+"s",p.syn,false);
  });
  return h;
}

/* ---------- Shell ---------- */
const treeEl=document.getElementById("tree"), pageEl=document.getElementById("page");
function pageProgress(id){
  const keys=Object.keys(state).filter(k=>k.startsWith(id+"__")&&state[k]===true).length;
  return keys;
}
function renderTree(cur){
  const top=PAGES.find(p=>p.top);
  treeEl.innerHTML=`<li><a href="#${top.id}" ${cur===top.id?'aria-current="page"':""}><span class="bullet"></span>[Nom du projet] · Accueil</a></li>`
   +PAGES.filter(p=>!p.top).map(p=>`<li class="child"><a href="#${p.id}" ${cur===p.id?'aria-current="page"':""}>${p.lane?`<span class="lane lane-${p.lane}"></span>`:'<span class="bullet"></span>'}<span>${esc(p.tree)}</span></a></li>`).join("");
}
function render(){
  let id=(location.hash||"").slice(1); if(!PAGES.find(p=>p.id===id)) id="accueil";
  const p=PAGES.find(x=>x.id===id); taskCounter=0;
  const body=STREAMS[id]?streamBody(id):BODY[id]();
  pageEl.innerHTML=`<div class="crumbs"><a href="#accueil">Digital Transformation Playbook</a>${p.top?"":` / <a href="#accueil">[Nom du projet] · Accueil</a>`}</div>
   <h1 class="title">[Nom du projet] · ${esc(p.title)}</h1>
   <div class="byline"><span>Modèle de page · Playbook v1</span><span class="progress" id="prog"></span>
     <span class="tools"><button class="btn" id="copyBtn" type="button">Copier pour Confluence</button></span></div>
   ${miroBox(p.miro)}
   <div class="content" id="content">${body}</div>`;
  renderTree(id); updateProgress();
  document.getElementById("copyBtn").onclick=copyPage;
  document.getElementById("side").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
function updateProgress(){
  const boxes=[...pageEl.querySelectorAll(".tasks input")];
  const prog=document.getElementById("prog"); if(!prog) return;
  if(!boxes.length){prog.textContent="";return;}
  const done=boxes.filter(b=>b.checked).length, pct=Math.round(done/boxes.length*100);
  prog.innerHTML=`<span class="bar"><i style="width:${pct}%"></i></span><span style="font-variant-numeric:tabular-nums">${done}/${boxes.length} tâches</span>`;
}
pageEl.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches(".tasks input")){ if(t.checked) state[t.dataset.k]=true; else delete state[t.dataset.k]; save(); updateProgress(); }
  if(t.matches("select.st")){ state[t.dataset.s]=t.value; save(); const lz=t.previousElementSibling; const opt=[...STATUS,["À décider","grey"],["Go","green"],["Ajustements","yellow"],["No-Go","red"]].find(o=>o[0]===t.value); lz.className="lz "+(opt?opt[1]:"grey"); lz.textContent=t.value; }
});
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200);}
async function copyPage(){
  const src=document.getElementById("content").cloneNode(true);
  src.querySelectorAll(".tasks li").forEach(li=>{const cb=li.querySelector("input");const lab=li.querySelector("label");li.innerHTML=(cb.checked?"☑ ":"☐ ")+lab.innerHTML;});
  src.querySelectorAll("select").forEach(s=>s.remove());
  const title=pageEl.querySelector("h1").textContent;
  const miro=pageEl.querySelector(".miro").cloneNode(true);
  const html=`<h1>${esc(title)}</h1>`+`<p><strong>Dans Miro :</strong> ${[...miro.querySelectorAll("a")].map(a=>`<a href="${a.href}">${esc(a.textContent)}</a>`).join(" · ")}</p>`+src.innerHTML;
  const tmp=document.createElement("div"); tmp.innerHTML=html; const text=tmp.innerText;
  try{
    if(window.ClipboardItem&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]);
    }else{ await navigator.clipboard.writeText(text); }
    toast("Page copiée, collez-la dans Confluence");
  }catch(e){
    const r=document.createRange(); r.selectNodeContents(document.getElementById("content"));
    const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast("Contenu sélectionné : utilisez Ctrl+C ou Cmd+C");
  }
}
document.getElementById("menuBtn").onclick=e=>{const s=document.getElementById("side");const o=s.classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",o);};
window.addEventListener("hashchange",render);
render();
</script>
