<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playbook Confluence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Confluence-like shell. Top bar, page tree on the left, a 760px reading column on the right. */
:root{
  --bg:#ffffff; --fg:#172b4d; --muted:#505f79; --faint:#6b778c;
  --line:#dfe1e6; --side:#f7f8f9; --hover:#ebecf0; --accent:#0c66e4; --accent-fg:#ffffff;
  --info-bg:#e9f2ff; --info-line:#cce0ff;
  --note-bg:#fff7d6; --note-line:#f8e6a0;
  --miro-bg:#fff9e0; --miro-line:#f5cd47;
  --lz-grey:#dfe1e6; --lz-grey-fg:#44546f; --lz-blue:#cce0ff; --lz-blue-fg:#0055cc;
  --lz-yellow:#f8e6a0; --lz-yellow-fg:#7f5f01; --lz-green:#baf3db; --lz-green-fg:#216e4e;
  --lz-red:#ffd5d2; --lz-red-fg:#ae2e24; --lz-purple:#dfd8fd; --lz-purple-fg:#5e4db2;
  --done:#6b778c; --check:#0c66e4;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Ubuntu,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d2125; --fg:#dee4ea; --muted:#9fadbc; --faint:#8c9bab;
  --line:#2c333a; --side:#161a1d; --hover:#282e33; --accent:#579dff; --accent-fg:#1d2125;
  --info-bg:#092957; --info-line:#0c3a7a; --note-bg:#3a2c00; --note-line:#533f04;
  --miro-bg:#332a05; --miro-line:#7f5f01;
  --lz-grey:#2c333a; --lz-grey-fg:#b6c2cf; --lz-blue:#09326c; --lz-blue-fg:#85b8ff;
  --lz-yellow:#533f04; --lz-yellow-fg:#f8e6a0; --lz-green:#164b35; --lz-green-fg:#7ee2b8;
  --lz-red:#5d1f1a; --lz-red-fg:#fd9891; --lz-purple:#352c63; --lz-purple-fg:#b8acf6;
  --done:#8c9bab; --check:#579dff; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1d2125; --fg:#dee4ea; --muted:#9fadbc; --faint:#8c9bab;
  --line:#2c333a; --side:#161a1d; --hover:#282e33; --accent:#579dff; --accent-fg:#1d2125;
  --info-bg:#092957; --info-line:#0c3a7a; --note-bg:#3a2c00; --note-line:#533f04;
  --miro-bg:#332a05; --miro-line:#7f5f01;
  --lz-grey:#2c333a; --lz-grey-fg:#b6c2cf; --lz-blue:#09326c; --lz-blue-fg:#85b8ff;
  --lz-yellow:#533f04; --lz-yellow-fg:#f8e6a0; --lz-green:#164b35; --lz-green-fg:#7ee2b8;
  --lz-red:#5d1f1a; --lz-red-fg:#fd9891; --lz-purple:#352c63; --lz-purple-fg:#b8acf6;
  --done:#8c9bab; --check:#579dff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;height:52px;
  border-bottom:1px solid var(--line);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.space-icon{width:28px;height:28px;border-radius:4px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.space-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.space-name small{display:block;font-weight:400;color:var(--faint);font-size:12px;line-height:1.2}
.top .grow{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:6px 10px;font:inherit;cursor:pointer}
.sim-tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:2px 6px;white-space:nowrap}

.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100% - 52px)}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 8px 32px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.side h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:8px 12px 8px;font-weight:600}
.tree{list-style:none;margin:0;padding:0}
.tree a{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:4px;color:var(--fg);font-size:14px;line-height:1.35}
.tree a:hover{background:var(--hover);text-decoration:none}
.tree a[aria-current="page"]{background:var(--lz-blue);color:var(--lz-blue-fg);font-weight:600}
.tree .child a{padding-left:30px}
.tree .bullet{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.tree .lane{width:10px;height:10px;border-radius:2px;flex:none}
.tree .count{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:780px;margin:0 auto}
.crumbs{font-size:13px;color:var(--faint);margin-bottom:12px}
.crumbs a{color:var(--faint)}
h1.title{font-size:28px;line-height:1.25;font-weight:600;margin:0 0 8px;text-wrap:balance;letter-spacing:-.01em}
.byline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;color:var(--faint);font-size:13px;margin-bottom:20px}
.progress{display:flex;align-items:center;gap:8px}
.bar{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lz-green-fg);width:0}
.tools{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:var(--hover)}

.content h2{font-size:20px;font-weight:600;margin:32px 0 8px;line-height:1.3;text-wrap:balance}
.content h3{font-size:16px;font-weight:600;margin:20px 0 6px}
.content p{margin:6px 0 10px;max-width:68ch}
.content ul.list{margin:6px 0 12px;padding-left:22px}
.content ul.list li{margin:3px 0}

.panel{border:1px solid var(--info-line);background:var(--info-bg);border-radius:4px;padding:12px 16px;margin:12px 0 16px}
.panel.note{background:var(--note-bg);border-color:var(--note-line)}
.panel p{margin:4px 0}
.panel-title{font-weight:600;margin-bottom:4px}

.miro{border:1px solid var(--miro-line);background:var(--miro-bg);border-radius:4px;padding:12px 16px;margin:0 0 20px}
.miro-head{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.miro-dot{width:18px;height:18px;border-radius:4px;background:#ffd02f;color:#050038;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.miro-links{display:flex;flex-wrap:wrap;gap:6px}
.miro-links a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:3px 9px;font-size:13px;color:var(--fg)}
.miro-links a:hover{border-color:var(--accent);text-decoration:none}
.miro-links a::after{content:"↗";color:var(--faint);font-size:11px}
.phase-link{font-size:13px;margin:-2px 0 8px;display:inline-flex;gap:6px;align-items:center}

.tasks{list-style:none;margin:4px 0 12px;padding:0}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:4px 6px;border-radius:4px}
.tasks li:hover{background:var(--hover)}
.tasks input{appearance:none;width:16px;height:16px;margin:3px 0 0;border:2px solid var(--faint);border-radius:3px;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--bg)}
.tasks input:checked{background:var(--check);border-color:var(--check)}
.tasks input:checked::after{content:"";width:4px;height:8px;border:solid var(--accent-fg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tasks label{cursor:pointer;min-width:0}
.tasks input:checked + label .txt{text-decoration:line-through;color:var(--done)}
.meta{color:var(--faint);font-size:12.5px;white-space:nowrap}
.tchip{display:inline-block;font-family:var(--mono);font-size:11.5px;border:1px solid var(--miro-line);background:var(--miro-bg);color:var(--fg);border-radius:3px;padding:0 5px;margin-left:4px;vertical-align:1px}
.tchip:hover{text-decoration:none;border-color:var(--accent)}

.lz{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:3px;padding:1px 5px;white-space:nowrap;line-height:1.5}
.lz.grey{background:var(--lz-grey);color:var(--lz-grey-fg)} .lz.blue{background:var(--lz-blue);color:var(--lz-blue-fg)}
.lz.yellow{background:var(--lz-yellow);color:var(--lz-yellow-fg)} .lz.green{background:var(--lz-green);color:var(--lz-green-fg)}
.lz.red{background:var(--lz-red);color:var(--lz-red-fg)} .lz.na{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--faint)} .lz.purple{background:var(--lz-purple);color:var(--lz-purple-fg)}

.fields{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:8px 0 16px}
.fields div{padding:8px 12px;border-bottom:1px solid var(--line)}
.fields div:nth-last-child(-n+2){border-bottom:0}
.fields .k{background:var(--side);font-weight:600}
.ph{color:var(--faint)}

.tbl-wrap{overflow-x:auto;margin:8px 0 16px;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--side);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.c{text-align:center}
select.st{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);padding:2px 4px}

.jql{font-family:var(--mono);font-size:12px;background:var(--side);border:1px solid var(--line);border-radius:4px;padding:6px 10px;margin:6px 0 12px;overflow-x:auto;white-space:nowrap}
.jkey{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap}
.jicon{display:inline-block;width:14px;height:14px;border-radius:3px;background:#4bade8;vertical-align:-2px;margin-right:6px}
.jicon.epic{background:#904ee2}
select.as{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);padding:2px 4px;max-width:170px}
details.epic{border:1px solid var(--line);border-radius:6px;margin:12px 0;background:var(--bg)}
details.epic>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
details.epic>summary::-webkit-details-marker{display:none}
details.epic>summary::before{content:"▸";color:var(--faint);width:10px}
details.epic[open]>summary::before{content:"▾"}
details.epic>summary .t{font-weight:600;font-size:16px}
details.epic>summary .cnt{margin-left:auto;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
details.epic .body{padding:0 14px 6px;border-top:1px solid var(--line)}
details.epic.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0 16px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{color:var(--faint);font-size:12.5px}
.mini{display:flex;gap:4px;margin-top:6px}
.mini i{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.mini i b{position:absolute;inset:0 auto 0 0;background:var(--lz-green-fg)}
.mini i.bl b{background:var(--lz-red-fg)}
table.mx td,table.mx th{text-align:center;vertical-align:middle}
table.mx td:first-child,table.mx th:first-child{text-align:left}
table.mx th.cur{background:var(--lz-blue);color:var(--lz-blue-fg)}
table.mx a.cell{display:block;text-decoration:none}
.lane-a{background:#8f7fee}.lane-b{background:#fe9f4d}.lane-c{background:#659df2}.lane-d{background:#2dc75c}.lane-g{background:#ffdc4a}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none;border-right:0;border-bottom:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .side.open{display:block}
  .menu-btn{display:inline-block}
  .sim-tag{display:none}
  .fields{grid-template-columns:1fr}
  .fields .k{border-bottom:0;padding-bottom:2px}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="top">
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">Pages</button>
  <div class="space-icon">DT</div>
  <div class="space-name">Digital Transformation Playbook<small>Espace · [Nom du projet]</small></div>
  <div class="grow"></div>
  <span class="sim-tag">Simulation Confluence</span>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Arborescence des pages">
    <h2>Pages</h2>
    <ul class="tree" id="tree"></ul>
  </nav>
  <main>
    <article class="page" id="page"></article>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script>
/* ---------- Page definitions ---------- */
const PAGES = [
 {id:"accueil", tree:"Accueil et mode d'emploi", title:"Accueil et mode d'emploi", top:true, miro:["f00","f02"]},
 {id:"vue", tree:"Vue d'ensemble", title:"Vue d'ensemble", miro:["f02","f03","f04","f05","f06","f07"]},
 {id:"fiche", tree:"Fiche projet", title:"Fiche projet", miro:["f01"]},
 {id:"jira", tree:"Mise en place Jira", title:"Mise en place Jira", miro:["f02"]},
 {id:"tableau", tree:"Tableau de bord", title:"Tableau de bord", miro:["f02","f01"]},
 {id:"stream-a", tree:"Stream A · Product et Business", lane:"a"},
 {id:"stream-b", tree:"Stream B · UX Research et Design", lane:"b"},
 {id:"stream-c", tree:"Stream C · Architecture et Technology", lane:"c"},
 {id:"stream-d", tree:"Stream D · Data, Analytics et Performance", lane:"d"},
 {id:"gates", tree:"Jalons et revues", title:"Jalons et revues", lane:"g", miro:["f02","f03","f04","f05","f06","f07"]},
 {id:"sync", tree:"Synchronisation Design et Tech", title:"Synchronisation Design et Tech", miro:["f02"]},
 {id:"gouvernance", tree:"Gouvernance", title:"Gouvernance", miro:["f01"]},
 {id:"roles-atelier", tree:"Rôles en atelier", title:"Rôles en atelier", miro:["la","lb","lc","ld"]},
 {id:"miro", tree:"Liens Miro", title:"Liens Miro du projet", miro:["f00"]},
 {id:"cr-atelier", tree:"Modèle · Compte-rendu d'atelier", title:"Modèle · Compte-rendu d'atelier", miro:["la","lb","lc","ld"]}
];
PAGES.forEach(p=>{ if(STREAMS[p.id]){ p.title="Stream "+STREAMS[p.id].name; p.miro=["l"+STREAMS[p.id].lane,"f02","f03","f04","f05","f06","f07"]; }});

/* ---------- Render helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rich(text){
  // placeholders in grey, T-codes as Miro chips
  let h=esc(text).replace(/\[[^\]]+\]/g,m=>`<span class="ph">${m}</span>`);
  return h.replace(/\s?\bT(0[1-9]|1[0-9]|2[0-4])\b/g,(m,n)=>{const k="T"+n;return ` <a class="tchip" href="${url(k)}" target="_blank" rel="noopener" title="Ouvrir le template ${esc(T_NAMES[k])} dans Miro">${k}</a>`;});
}
let taskCounter=0;
function tasks(pageId, group, items, withMeta=true){
  return `<ul class="tasks">${items.map((t,i)=>{
    const id=`${pageId}__${group}__${i}`; const dom="t"+(taskCounter++);
    return `<li><input type="checkbox" id="${dom}" data-k="${id}" ${state[id]?"checked":""}><label for="${dom}"><span class="txt">${rich(t)}</span>${withMeta?` <span class="meta">· ${rich(PR)}</span>`:""}</label></li>`;
  }).join("")}</ul>`;
}
const list=items=>`<ul class="list">${items.map(i=>`<li>${rich(i)}</li>`).join("")}</ul>`;
const panel=(title,body,cls="")=>`<div class="panel ${cls}">${title?`<div class="panel-title">${title}</div>`:""}${body}</div>`;
function miroBox(keys){
  return `<div class="miro"><div class="miro-head"><span class="miro-dot">M</span>Dans Miro</div><div class="miro-links">${keys.map(k=>`<a href="${url(k)}" target="_blank" rel="noopener">${esc(FRAME_NAMES[k])}</a>`).join("")}</div></div>`;
}
function fields(rows){ return `<div class="fields">${rows.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${rich(v)}</div>`).join("")}</div>`; }
const STATUS=[["Non démarré","grey"],["En cours","blue"],["En revue","yellow"],["Validé","green"]];
function statusSelect(key, opts=STATUS){
  const v=state[key]||opts[0][0]; const col=(opts.find(o=>o[0]===v)||opts[0])[1];
  return `<span class="lz ${col}">${esc(v)}</span> <select class="st" data-s="${key}" aria-label="Changer le statut">${opts.map(o=>`<option ${o[0]===v?"selected":""}>${esc(o[0])}</option>`).join("")}</select>`;
}
function table(head, rows, center=false){
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${center&&i>0?' class="c"':""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const ROLE_MAP={"R":"D","A":"V","A/R":"V/D","C":"P","I":"I"};
const raciLz=v=>{const r=ROLE_MAP[v]||v;const m={"D":"blue","V":"green","V/D":"purple","P":"yellow","I":"grey"};return `<span class="lz ${m[r]}">${r}</span>`;};
const ROLES=[
 ["D","Doer","Anime le contenu de l'atelier, apporte l'expertise et produit les livrables.","blue"],
 ["P","Participant","Contribue aux discussions, partage ses idées et son expertise.","yellow"],
 ["I","Informed","Est tenu informé des décisions, des résultats et de l'avancement.","grey"],
 ["V","Validator","Valide les propositions, les décisions et les livrables.","green"],
 ["F","Facilitator","Garant du cadre, présent sur tous les ateliers (Facilitateur Digital Factory, binôme : Scrum master) : ouvre et clôture l'atelier, tient le temps, veille à la dynamique et prépare le Doer.","purple"]
];
const phaseTitle=i=>`${PH[i].n} · ${PH[i].name} · ${PH[i].sub}`;
const phaseHead=i=>`${esc(PH[i].n+' · '+PH[i].name)} <span class="lz purple" style="vertical-align:3px">${esc(PH[i].sub)}</span>`;
const SYNC=PH.map((p,i)=>Object.values(STREAMS).flatMap(s=>s.phases[i].syn.map(x=>s.name.split(' · ')[0]+' · '+x)));
const phaseLink=i=>`<a class="phase-link" href="${url(PH[i].f)}" target="_blank" rel="noopener"><span class="miro-dot">M</span>${esc(FRAME_NAMES[PH[i].f])} ↗</a>`;

function assigneeSelect(t){ const v=jAssignee(t); const opts=ASSIGNEES.includes(v)?ASSIGNEES:[v,...ASSIGNEES];
  return `<span class="as-v" hidden>${esc(v)}</span><select class="as" data-a="ji__${t.id}__a" aria-label="Assigné">${opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`; }
function jTable(list,showStream=false){

function cellLz(c){ if(!c.total) return c.na?'<span class="lz na">N/A</span>':'<span class="ph">–</span>';

function csvExport(){
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;

  const csv="﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");

   {t:"Étape 5 · Suivre", w:"Jusqu'à l'atelier suivant ou au jalon", items:{
     D:["Réaliser les actions et produire les livrables"],
     V:["Valider les livrables quand ils sont prêts"],
     F:["Vérifier l'avancement des actions","Déclencher les points de synchronisation avec les autres streams","Préparer l'atelier suivant avec son Doer"],
     I:["Suivre l'avancement dans le Tableau de bord"]}}
  ];
  let h=panel("En une phrase","<p>Le Facilitator tient le cadre et la dynamique sur tous les ateliers, le Doer anime le contenu et produit, les Participants enrichissent, le Validator tranche, les Informed sont tenus au courant.</p>");
  const roleLz=v=>{ if(v==="-") return '<span class="ph">–</span>'; const c={"F":"purple","V":"green","D":"blue","P":"yellow","I":"grey"}[v]; return `<span class="lz ${c}">${v}</span>`; };
  h+=`<h2>Parties prenantes de la Digital Factory</h2>`
   +table(["Partie prenante","Rôle dans le projet"],STAKE.map(s=>[`<strong>${esc(s[1])}</strong>`,esc(s[2])]));
  h+=`<h2>Rôle de chaque partie prenante, atelier par atelier</h2>`
   +`<p>Repris du bloc « Rôles de l'atelier » de chaque template Miro, à ajuster au projet. F = Facilitator · V = Validator · D = Doer · P = Participant · I = Informed · – = non concerné. Cliquez sur un code d'atelier pour ouvrir son template dans Miro.</p>`;
  const head=["Atelier",...STAKE.map(s=>s[1].replace(" · Hicham",""))];
  const row=r=>{ const k=r[0]; const name=k==="Gates"?"Jalons client et revues internes":T_NAMES[k];
      const c=k==="Gates"?`<a href="#gates"><strong>${esc(name)}</strong></a>`:`<a class="tchip" style="margin:0 6px 0 0" href="${url(k)}" target="_blank" rel="noopener">${k}</a>${esc(name)}`;
      return [c,...r.slice(1).map(roleLz)]; };
  Object.entries(STREAM_T).forEach(([l,ts])=>{
    const sid="stream-"+l;
    h+=`<h3><span class="lane lane-${l}"></span> Stream ${esc(STREAMS[sid].name)}</h3>`
     +table(head,ts.map(([k])=>row(ATELIER_ROLES.find(r=>r[0]===k))),true);
  });
  h+=`<h3>Jalons et revues</h3>`+table(head,[row(ATELIER_ROLES.find(r=>r[0]==="Gates"))],true);
  h+=`<h2>Ce que fait chaque rôle à chaque étape</h2>`+table(["Rôle","Préparer","Animer","Décider","Restituer","Suivre"],
    ["F","V","D","P","I"].map(k=>[lz(k),...STEPS.map(s=>s.items[k]?esc(s.items[k][0]):'<span class="ph">·</span>')]));
  STEPS.forEach((s,i)=>{
    h+=`<h2>${esc(s.t)}</h2><p><strong>Quand :</strong> ${esc(s.w)}</p>`;
    ["F","V","D","P","I"].forEach(k=>{ if(s.items[k]){ h+=`<h3>${lz(k)}</h3>`+tasks("roles-atelier",`s${i}${k}`,s.items[k],false); }});
  });
  return h+`<h2>Règles d'or</h2>`+list(["Une seule personne Validator par décision.","Le Facilitator est le même sur tous les ateliers. En son absence, le Scrum master prend le relais.","Le Facilitator ne tranche pas et n'anime pas le contenu : il garantit le cadre, le Doer anime.","Au-delà de 8 Participants actifs, faire des sous-groupes.","Les Informed ne sont pas invités à l'atelier : ils reçoivent le compte-rendu.","Chaque action sort de l'atelier avec un Doer et une date."]);
 },
 "cr-atelier"(){
  return panel("Modèle","<p>À dupliquer comme sous-page de « Comptes-rendus d'ateliers » après chaque atelier. Titre conseillé : [Nom du projet] · CR · [Nom de l'atelier] · [Date].</p>")
  +`<h2>Informations</h2>`+fields([["Atelier","[T01 à T24 · Nom de l'atelier]"],["Frame Miro","[Lien]"],["Étape","[00 à 05]"],["Stream porteur","[A, B, C ou D]"],["Date et durée","[Date] · [Durée]"]])
  +`<h2>Rôles de l'atelier</h2><p>Voir <a href="#roles-atelier">Rôles en atelier</a> pour ce que chaque rôle fait à chaque étape.</p>`
  +fields([["F · Facilitator","[Facilitateur Digital Factory] · binôme : [Scrum master]"],["V · Validator","[Responsable] (une seule personne par décision)"],["D · Doers","[Noms] · animent le contenu et produisent les livrables"],["P · Participants","[Noms et rôles]"],["I · Informed","[Noms] · reçoivent ce compte-rendu"]])
  +`<h2>Objectif de l'atelier</h2><p class="ph">[Ce que l'atelier devait produire]</p>`
  +`<h2>Ce qui en ressort</h2>`+list(["[Résultat clé 1]","[Résultat clé 2]","[Résultat clé 3]"])
  +`<h2>Décisions prises</h2>`+list(["[Décision] · à reporter dans le Decision Log"])
  +`<h2>Actions</h2>`+tasks("cr","act",["[Action]","[Action]"])
  +`<h2>Livrables impactés</h2>`+list(["[Livrable] · nouveau statut à reporter dans le Tableau de bord"])
  +`<h2>Critères de validation de l'atelier</h2>`+tasks("cr","crit",["Les critères du template Miro sont atteints","Les décisions sont tracées","Les actions ont un responsable et une date"],false);
 }
};
function streamBody(id){
  const s=STREAMS[id]; const cs=curStep(); const mine=JTASKS.filter(t=>t.sid===id);
  const cur=jStats(mine.filter(t=>t.epic===cs)); const tot=jStats(mine);
  let h=fields([["Responsable","[Responsable]"],["Contributeurs","[Noms]"],["Rôle du stream",s.role]]);
  h+=`<h2>Où j'en suis</h2>`
   +`<div class="kpis"><div class="kpi"><b>${esc(PH[cs].n)} · ${esc(PH[cs].name)}</b><span>Étape en cours (réglée dans la <a href="#vue">Vue d'ensemble</a>)</span></div><div class="kpi"><b>${cur.done}/${cur.total}</b><span>tâches de l'étape terminées</span></div><div class="kpi"><b>${cur.blocked}</b><span>tâche${cur.blocked>1?"s":""} bloquée${cur.blocked>1?"s":""}</span></div><div class="kpi"><b>${esc(GATES[cs].t)}</b><span>${GATES[cs].type==="client"?"Prochain jalon client":"Prochaine revue interne"} · [Date]</span></div></div>`
   +`<div class="mini" title="Avancement par étape">${PH.map((_,i)=>{const c=jStats(mine.filter(t=>t.epic===i));return `<i class="${c.blocked?"bl":""}" title="${esc(PH[i].n+" · "+PH[i].name)} : ${c.pct} %"><b style="width:${c.pct}%"></b></i>`;}).join("")}</div>`
   +`<p class="meta">${tot.done}/${tot.total} tâches terminées sur tout le projet</p>`;
  const ts=STREAM_T[s.lane]||[];
  h+=`<h2>Ateliers du stream</h2><p>Dans l'ordre des étapes, comme la bande du stream dans Miro. Le Facilitator est le Facilitateur Digital Factory sur chaque atelier.</p>`
   +table(["Atelier","Étape","Doer (anime le contenu)"],ts.map(([k,st])=>[`<a class="tchip" style="margin:0 6px 0 0" href="${url(k)}" target="_blank" rel="noopener">${k}</a>${esc(T_NAMES[k])}`,esc(st),esc(doersOf(k))]));
  h+=`<h2>Mes tâches Jira, par epic</h2>`
   +panel("Dans Confluence",`<p><a href="jira.html#board-${s.lane}">Ouvrir le tableau Jira du stream ↗</a></p>`+"<p>Chaque tableau ci-dessous est une macro <strong>Jira Issues</strong>. Le statut et l'assigné se modifient dans Jira, la page se met à jour seule.</p>"+jqlBox(`project = ${PRJ} AND component = "${COMP(id)}" ORDER BY "Epic Link", rank`));
  s.phases.forEach((p,i)=>{
   const list=mine.filter(t=>t.epic===i); const c=jStats(list);
   h+=`<details class="epic${i===cs?" cur":""}" data-i="${i}" ${i===cs?"open":""}><summary><span class="jkey">${esc(EPICS[i].key)}</span><span class="t">${esc(PH[i].n+" · "+PH[i].name)}</span><span class="lz purple">${esc(PH[i].sub)}</span>${i===cs?'<span class="lz blue">En cours</span>':""}<span class="cnt">${c.done}/${c.total}${c.na?` · ${c.na} N/A`:""}${c.blocked?` · <span class="lz red">${c.blocked} bloquée${c.blocked>1?"s":""}</span>`:""}</span></summary><div class="body">`
    +`${phaseLink(i)}<p><strong>Objectif de l'étape :</strong> ${esc(PH[i].obj)}</p>`
    +jTable(list)
    +`<h3>Ce que je dois livrer</h3>`+tasks(id,"p"+i+"c",p.con,false)
    +`<h3>Engagements avec les autres streams</h3>`+tasks(id,"p"+i+"s",p.syn,false)
    +`</div></details>`;
  });
  return h;
}

/* ---------- Shell ---------- */
const treeEl=document.getElementById("tree"), pageEl=document.getElementById("page");
function pageProgress(id){
  const keys=Object.keys(state).filter(k=>k.startsWith(id+"__")&&state[k]===true).length;
  return keys;
}
function renderTree(cur){
  const top=PAGES.find(p=>p.top);
  treeEl.innerHTML=`<li><a href="#${top.id}" ${cur===top.id?'aria-current="page"':""}><span class="bullet"></span>[Nom du projet] · Accueil</a></li>`
   +PAGES.filter(p=>!p.top).map(p=>`<li class="child"><a href="#${p.id}" ${cur===p.id?'aria-current="page"':""}>${p.lane?`<span class="lane lane-${p.lane}"></span>`:'<span class="bullet"></span>'}<span>${esc(p.tree)}</span></a></li>`).join("");
}
function render(keep){
  const y=window.scrollY; const opened=[...pageEl.querySelectorAll("details.epic[open]")].map(d=>d.dataset.i);
  let id=(location.hash||"").slice(1); if(!PAGES.find(p=>p.id===id)) id="accueil";
  const p=PAGES.find(x=>x.id===id); taskCounter=0;
  const body=STREAMS[id]?streamBody(id):BODY[id]();
  pageEl.innerHTML=`<div class="crumbs"><a href="#accueil">Digital Transformation Playbook</a>${p.top?"":` / <a href="#accueil">[Nom du projet] · Accueil</a>`}</div>
   <h1 class="title">[Nom du projet] · ${esc(p.title)}</h1>
   <div class="byline"><span>Modèle de page · Playbook v1</span><span class="progress" id="prog"></span>
     <span class="tools"><button class="btn" id="copyBtn" type="button">Copier pour Confluence</button></span></div>
   ${miroBox(p.miro)}
   <div class="content" id="content">${body}</div>`;
  renderTree(id); updateProgress();
  document.getElementById("copyBtn").onclick=copyPage;
  document.getElementById("side").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  if(keep){ pageEl.querySelectorAll("details.epic").forEach(d=>{ d.open=opened.includes(d.dataset.i); }); window.scrollTo(0,y); }
  else window.scrollTo(0,0);
  const cb=document.getElementById("csvBtn"); if(cb) cb.onclick=csvExport;
}
function updateProgress(){
  const prog=document.getElementById("prog"); if(!prog) return;
  const jsel=[...pageEl.querySelectorAll('details.epic select.st[data-s^="ji__"]')];
  if(jsel.length){ const d=jsel.filter(x=>x.value==="Terminé").length, pc=Math.round(d/jsel.length*100); prog.innerHTML=`<span class="bar"><i style="width:${pc}%"></i></span><span style="font-variant-numeric:tabular-nums">${d}/${jsel.length} tâches Jira</span>`; return; }
  const boxes=[...pageEl.querySelectorAll(".tasks input")];
  if(pageEl.querySelector("table.mx")){prog.textContent="";return;}
  if(!boxes.length){prog.textContent="";return;}
  const done=boxes.filter(b=>b.checked).length, pct=Math.round(done/boxes.length*100);
  prog.innerHTML=`<span class="bar"><i style="width:${pct}%"></i></span><span style="font-variant-numeric:tabular-nums">${done}/${boxes.length} tâches</span>`;
}
pageEl.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches(".tasks input")){ if(t.checked) state[t.dataset.k]=true; else delete state[t.dataset.k]; save(); updateProgress(); }
  if(t.matches("select.st")){ state[t.dataset.s]=t.value; save(); if(t.dataset.rerender||t.dataset.s.startsWith("ji__")){ render(true); return; } const lz=t.previousElementSibling; const opt=[...STATUS,...JSTATUS,["À décider","grey"],["Go","green"],["Ajustements","yellow"],["No-Go","red"]].find(o=>o[0]===t.value); lz.className="lz "+(opt?opt[1]:"grey"); lz.textContent=t.value; }
  if(t.matches("select.as")){ state[t.dataset.a]=t.value; save(); render(true); }
});
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200);}
async function copyPage(){
  const src=document.getElementById("content").cloneNode(true);
  src.querySelectorAll(".tasks li").forEach(li=>{const cb=li.querySelector("input");const lab=li.querySelector("label");li.innerHTML=(cb.checked?"☑ ":"☐ ")+lab.innerHTML;});
  src.querySelectorAll(".as-v").forEach(x=>x.hidden=false); src.querySelectorAll("details").forEach(d=>d.open=true); src.querySelectorAll("select").forEach(s=>s.remove());
  const title=pageEl.querySelector("h1").textContent;
  const miro=pageEl.querySelector(".miro").cloneNode(true);
  const html=`<h1>${esc(title)}</h1>`+`<p><strong>Dans Miro :</strong> ${[...miro.querySelectorAll("a")].map(a=>`<a href="${a.href}">${esc(a.textContent)}</a>`).join(" · ")}</p>`+src.innerHTML;
  const tmp=document.createElement("div"); tmp.innerHTML=html; const text=tmp.innerText;
  try{
    if(window.ClipboardItem&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]);
    }else{ await navigator.clipboard.writeText(text); }
    toast("Page copiée, collez-la dans Confluence");
  }catch(e){
    const r=document.createRange(); r.selectNodeContents(document.getElementById("content"));
    const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast("Contenu sélectionné : utilisez Ctrl+C ou Cmd+C");
  }
}
document.getElementById("menuBtn").onclick=e=>{const s=document.getElementById("side");const o=s.classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",o);};
window.addEventListener("hashchange",()=>render());
window.addEventListener("storage",e=>{ if(e.key===KEY){ try{ state=JSON.parse(e.newValue||"{}")||{}; }catch(_){ state={}; } render(true); } });
render();
</script>
