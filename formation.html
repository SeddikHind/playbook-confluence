<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --fg:#14142b; --muted:#55566b; --faint:#7a7b8f; --line:#e7e5df; --soft:#f3f1ec;
  --accent:#4b3fd1; --accent-soft:#ecebfd; --accent-fg:#ffffff;
  --a:#8f7fee; --b:#fe9f4d; --c:#659df2; --d:#2dc75c; --g:#f2c230;
  --a-soft:#efecfd; --b-soft:#fff1e4; --c-soft:#e8f0fd; --d-soft:#e3f8ea; --g-soft:#fff6d6;
  --ok:#1f8a4c; --ok-soft:#e1f5e8; --ko:#c2382b; --ko-soft:#fde7e4;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121220; --surface:#1b1b2c; --fg:#ecebf5; --muted:#b4b3c8; --faint:#8f8ea6; --line:#2c2c42; --soft:#202033;
  --accent:#9d93ff; --accent-soft:#2a2750; --accent-fg:#121220;
  --a-soft:#2a2550; --b-soft:#3a2614; --c-soft:#182b47; --d-soft:#143322; --g-soft:#3a3010;
  --ok:#5fd394; --ok-soft:#153325; --ko:#ff8a7d; --ko-soft:#3d1a17; --shadow:0 0 0 1px #2c2c42; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121220; --surface:#1b1b2c; --fg:#ecebf5; --muted:#b4b3c8; --faint:#8f8ea6; --line:#2c2c42; --soft:#202033;
  --accent:#9d93ff; --accent-soft:#2a2750; --accent-fg:#121220;
  --a-soft:#2a2550; --b-soft:#3a2614; --c-soft:#182b47; --d-soft:#143322; --g-soft:#3a3010;
  --ok:#5fd394; --ok-soft:#153325; --ko:#ff8a7d; --ko-soft:#3d1a17; --shadow:0 0 0 1px #2c2c42; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--head);letter-spacing:-.02em;line-height:1.15;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:14px;height:60px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mark{display:flex;gap:3px}
.mark i{width:8px;height:22px;border-radius:3px}
.brand{font-family:var(--head);font-weight:700;font-size:17px;white-space:nowrap}
.brand small{font-family:var(--sans);font-weight:500;color:var(--faint);font-size:13px;margin-left:6px}
.grow{flex:1}
.me{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.me b{font-weight:700}
.ring{--p:0;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1240px;margin:0 auto}
.side{position:sticky;top:60px;align-self:start;padding:28px 16px 28px max(20px,env(safe-area-inset-left,0px));height:calc(100vh - 60px);overflow:auto}
.side ol{list-style:none;margin:0;padding:0;counter-reset:m}
.side a{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-size:14.5px;line-height:1.3}
.side a:hover{background:var(--soft)}
.side a[aria-current="page"]{background:var(--accent-soft);font-weight:700}
.side .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:var(--surface)}
.side .done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.side .t small{display:block;color:var(--faint);font-weight:400;font-size:12px}
.side h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 10px 10px}
.side .links{margin-top:24px}
.side .links a{font-size:13.5px;color:var(--muted)}

main{min-width:0;padding:32px max(20px,env(safe-area-inset-right,0px)) 80px 28px}
.view{max-width:860px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.view h1{font-size:clamp(30px,4.2vw,46px);font-weight:800;margin-bottom:14px;text-wrap:balance}
.view h2{font-size:24px;font-weight:700;margin:36px 0 12px;text-wrap:balance}
.view h3{font-size:18px;font-weight:700;margin:0 0 6px}
.lead{font-size:19px;color:var(--muted);max-width:62ch;margin:0 0 24px;text-wrap:pretty}
p{max-width:68ch}

.hero{position:relative;border-radius:24px;padding:36px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;margin-bottom:28px}
.hero .bands{position:absolute;right:-90px;top:-40px;display:flex;gap:10px;transform:rotate(-14deg);opacity:.9;pointer-events:none}
.hero .bands i{width:26px;height:260px;border-radius:13px}
.hero > *:not(.bands){position:relative}
.hero h1{max-width:16ch}
.hero .lead{max-width:46ch}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15.5px}
.cta:hover{filter:brightness(1.07)}
.ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg);font-size:15px}
.ghost:hover{border-color:var(--accent)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border-radius:18px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card p{margin:6px 0 0;color:var(--muted);font-size:15px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.bg-a{background:var(--a)}.bg-b{background:var(--b)}.bg-c{background:var(--c)}.bg-d{background:var(--d)}.bg-g{background:var(--g)}
.sf-a{background:var(--a-soft)}.sf-b{background:var(--b-soft)}.sf-c{background:var(--c-soft)}.sf-d{background:var(--d-soft)}.sf-g{background:var(--g-soft)}

.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:18px 0}
.vs .arrow{display:grid;place-items:center;font-size:24px;color:var(--faint)}
.vs .card h3{font-size:16px}
.vs ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:15px}
.vs .bad{background:var(--ko-soft);border-color:transparent}
.vs .good{background:var(--ok-soft);border-color:transparent}

.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:20px 0 0;position:relative}
.step{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:4px}
.step b{font-family:var(--head);font-size:22px}
.step span{font-size:13px;line-height:1.25;font-weight:600}
.step small{font-size:11.5px;color:var(--faint);line-height:1.2}
.step.gc{border-bottom:6px solid var(--g)}
.step.gi{border-bottom:6px solid color-mix(in srgb,var(--g) 40%,transparent)}
.step[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.gates{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.gates i{height:6px;border-radius:3px;background:var(--g);opacity:.45}
.gates i.client{opacity:1}
.detail{margin-top:18px}
.detail .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.gate-box{border-radius:16px;padding:16px 18px;background:var(--g-soft);border:1px solid color-mix(in srgb,var(--g) 50%,transparent)}
.gate-box ul,.list{margin:8px 0 0;padding-left:20px;font-size:15px;color:var(--muted)}
.gate-box li,.list li{margin:3px 0}
.wk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tc{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--surface)}
.tc code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.tc.mine{border-color:var(--accent);background:var(--accent-soft)}
.tc:hover{border-color:var(--accent)}

.stream{border-radius:18px;padding:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.stream .hd{display:flex;align-items:center;gap:10px}
.stream .hd b{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--head);font-size:18px;color:#fff;flex:none}
.stream p{margin:0;color:var(--muted);font-size:14.5px}
.spark{display:flex;gap:4px;align-items:flex-end;height:42px}
.spark i{flex:1;border-radius:4px 4px 2px 2px;min-height:4px}
.spark-l{display:flex;gap:4px;font-size:11px;color:var(--faint)}
.spark-l span{flex:1;text-align:center}

.roles5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
.r5{border-radius:16px;padding:14px;border:1px solid var(--line);background:var(--surface)}
.r5 .L{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:20px;margin-bottom:8px}
.r5 h3{font-size:16px}
.r5 p{font-size:13.5px;color:var(--muted);margin:4px 0 0}
.Lf{background:#dedaff;color:#3b2fa8}.Lv{background:#adf0c7;color:#13623a}.Ld{background:#c6dcff;color:#1d4fa3}.Lp{background:#fff1a6;color:#6b5300}.Li{background:#e7e7ea;color:#45465a}
.picker{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 14px}
select.pick{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--fg);max-width:100%}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.who .col{border-radius:14px;padding:12px;background:var(--soft)}
.who .col h4{margin:0 0 8px;display:flex;gap:8px;align-items:center;font-size:14px}
.who .col h4 .L{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px}
.who .p{display:block;font-size:13.5px;padding:3px 0}
.who .p.mine{font-weight:700;color:var(--accent)}
.big{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:16px;background:var(--accent-soft);margin-top:14px}
.big .L{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:26px;flex:none}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.ws{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.w{border-radius:16px;padding:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.w::before{content:"";position:absolute;inset:0 auto 0 0;width:5px}
.w.a::before{background:var(--a)}.w.b::before{background:var(--b)}.w.c::before{background:var(--c)}.w.d::before{background:var(--d)}
.w code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--faint)}
.w h3{font-size:16.5px}
.w .meta{font-size:13px;color:var(--muted)}
.w .you{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}
.w a{margin-top:auto;font-size:13.5px;font-weight:600;text-decoration:none}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.tool{border-radius:20px;padding:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.tool .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-family:var(--head);font-size:20px}
.tool ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}
.tool a{margin-top:auto}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:20px 0;padding:16px;border-radius:16px;background:var(--soft);font-size:14.5px}
.flow b{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:600}
.flow span{color:var(--faint)}

.q{border-radius:18px;padding:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.q .sit{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.q h3{font-size:18px;margin:6px 0 12px;font-family:var(--sans);font-weight:700;letter-spacing:0;line-height:1.35}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;font-size:14.5px;color:var(--muted)}
.fb b{color:var(--fg)}
.cert{margin-top:24px;border-radius:24px;padding:32px;background:var(--surface);border:2px solid var(--accent);box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.cert .bands{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.cert .bands i{width:44px;height:8px;border-radius:4px}
.cert h2{margin:6px 0}
.cert input{font:inherit;font-size:18px;border:0;border-bottom:2px dashed var(--line);background:transparent;color:var(--fg);text-align:center;padding:6px;width:min(360px,100%);margin:10px 0}
.cert .small{font-size:13.5px;color:var(--faint)}
.cert p{margin-left:auto;margin-right:auto}

.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:30}
.mobnav{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobnav{display:flex;gap:6px;overflow-x:auto;padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);scrollbar-width:none}
  .mobnav a{flex:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;text-decoration:none;color:var(--fg);white-space:nowrap}
  .mobnav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  .mobnav a.done{border-color:var(--ok)}
  main{padding:22px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
  .hero{padding:24px}
  .brand small{display:none}
  .steps,.gates{grid-template-columns:repeat(3,1fr)}
  .roles5{grid-template-columns:repeat(2,1fr)}
  .tools{grid-template-columns:1fr}
  .vs{grid-template-columns:1fr}
  .vs .arrow{transform:rotate(90deg)}
}
@media (max-width:420px){ .brand{display:none} .roles5{grid-template-columns:1fr} }
@media print{ .top,.side,.mobnav,.nav,.no-print{display:none!important} .shell{display:block} main{padding:0} .cert{box-shadow:none} }
@media (prefers-reduced-motion:no-preference){ .view{animation:in .35s ease} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>

<script>
/* ---------- Progress, kept per viewer ---------- */
const FK="playbook-formation-v1";
let P={role:null,done:{},quiz:{},name:""};
try{ P=Object.assign(P,JSON.parse(localStorage.getItem(FK)||"{}")); }catch(e){}
const saveP=()=>{ try{ localStorage.setItem(FK,JSON.stringify(P)); }catch(e){} };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200);};

const MODS=[
 {id:"pourquoi",t:"Pourquoi ce playbook",d:"3 min"},
 {id:"demarche",t:"La démarche en 6 étapes",d:"5 min"},
 {id:"streams",t:"Les 4 streams",d:"3 min"},
 {id:"roles",t:"Les rôles en atelier",d:"4 min"},
 {id:"ateliers",t:"Les 24 ateliers",d:"3 min"},
 {id:"outils",t:"Miro, Jira, Confluence",d:"3 min"},
 {id:"situations",t:"Mises en situation",d:"5 min"}
];
const ROLE_LIST=STAKE.filter(s=>s[0]!=="US");
const roleName=c=>c?STAKE.find(s=>s[0]===c)[1].replace(" · Hicham",""):"à choisir";
const LANES=["a","b","c","d"]; const SID=l=>"stream-"+l;
const sName=l=>STREAMS[SID(l)].name;
const roleIn=(k,c=P.role)=>{ if(!c) return null; if(c==="FD") return "F"; const r=AR_SRC[k]; if(!r) return null; for(const x of ["V","D","P","I"]) if(r[x].split(" ").includes(c)) return x; return null; };

const tChip=k=>{const r=roleIn(k);return `<a class="tc ${r==="D"||r==="V"?"mine":""}" href="${url(k)}" target="_blank" rel="noopener" title="Ouvrir le template dans Miro"><code>${k}</code>${esc(T_NAMES[k])}${r?` <span class="tag" style="padding:1px 7px">${r}</span>`:""}</a>`;};
const navBtns=i=>{const prev=MODS[i-1],next=MODS[i+1];

   ${next?`<button class="cta" type="button" data-finish="${MODS[i].id}" data-next="${next.id}">J'ai compris · ${esc(next.t)} →</button>`:""}</div>`;};

  const c=cur(); const pct=Math.round(Object.keys(P.done).filter(k=>MODS.some(m=>m.id===k)).length/MODS.length*100);
  document.getElementById("ring").style.setProperty("--p",pct); document.getElementById("ringTxt").textContent=pct+"%";
  document.getElementById("meName").textContent=roleName(P.role);
  document.getElementById("modnav").innerHTML=MODS.map((m,i)=>`<li class="${P.done[m.id]?"done":""}"><a href="#${m.id}" ${c===m.id?'aria-current="page"':""}><span class="n">${P.done[m.id]?"✓":i+1}</span><span class="t">${esc(m.t)}<small>${m.d}</small></span></a></li>`).join("");
  document.getElementById("mobnav").innerHTML=`<a href="#accueil" ${c==="accueil"?'aria-current="page"':""}>Accueil</a>`+MODS.map((m,i)=>`<a href="#${m.id}" class="${P.done[m.id]?"done":""}" ${c===m.id?'aria-current="page"':""}>${P.done[m.id]?"✓ ":""}${i+1}. ${esc(m.t)}</a>`).join("");
  const cur_=document.querySelector('.mobnav [aria-current]'); if(cur_) cur_.scrollIntoView({inline:"center",block:"nearest"});
}
function render(keep){
  const y=window.scrollY; view.innerHTML=V[cur()](); chrome();
  if(keep) window.scrollTo(0,y); else window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a"); if(!t) return;
  if(t.dataset.role){ P.role=P.role===t.dataset.role?null:t.dataset.role; saveP(); render(true); return; }
  if(t.dataset.finish){ P.done[t.dataset.finish]=true; saveP(); location.hash=t.dataset.next; return; }
  if(t.dataset.step!==undefined){ selStep=+t.dataset.step; render(true); return; }
  if(t.dataset.wl){ WF.lane=t.dataset.wl; render(true); return; }
  if(t.dataset.ws){ WF.step=t.dataset.ws; render(true); return; }
  if(t.dataset.wm){ WF.mine=!WF.mine; render(true); return; }
  if(t.dataset.q!==undefined){ P.quiz[t.dataset.q]=+t.dataset.o; if(Object.keys(P.quiz).length===QS.length){ P.done.situations=true; } saveP(); render(true); return; }
  if(t.id==="retry"){ P.quiz={}; delete P.done.situations; saveP(); render(); return; }
  if(t.id==="printBtn"){ window.print(); return; }
  if(t.id==="meBtn"){ location.hash="accueil"; setTimeout(()=>{const r=document.querySelector(".roles");if(r)r.scrollIntoView({block:"center"});},50); return; }
});
document.addEventListener("change",e=>{ if(e.target.id==="selT"){ selT=e.target.value; render(true); } });
document.addEventListener("input",e=>{ if(e.target.id==="certName"){ P.name=e.target.value; saveP(); } });
window.addEventListener("hashchange",()=>render());
document.getElementById("lnMiro").href=BOARD;
const tm=()=>{const a=document.getElementById("toMiro"); if(a) a.href=BOARD;};
new MutationObserver(tm).observe(view,{childList:true});
render();
</script>
</body></html>
